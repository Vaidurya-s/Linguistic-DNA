services:
  db:
    image: postgres:16
    # Settings for bulk imports (make research-db / full-db): bigger memory for index builds
    # and fewer checkpoints; still modest enough for a laptop.
    command: >
      postgres -c shared_buffers=1GB -c maintenance_work_mem=1GB -c work_mem=64MB
      -c max_wal_size=8GB -c checkpoint_timeout=30min
    shm_size: 1gb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lsg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
